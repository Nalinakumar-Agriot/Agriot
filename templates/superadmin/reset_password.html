{% extends "superadmin/auth_base.html" %}
{% load static %}

{% block page_css %}
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
<style>
.input-group {
  position: relative;
}

.form-control {
  padding-right: 40px;
}

.toggle-eye {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #000000;
  z-index: 10;   /* 🔥 important */
  font-size: 18px;
}

.toggle-eye:hover {
  color: #008A5C;
}
</style>
{% endblock %}

{% block content %}
<div class="authentication-wrapper authentication-cover">
  <div class="authentication-inner row m-0">

    <!-- LEFT -->
    <div class="d-flex col-12 col-lg-4 col-xl-4 align-items-center authentication-bg px-6">
      <div class="w-px-400 mx-auto text-center">

        <img src="{% static 'img/auth/agri_logo_3.png' %}" width="200">

        <h5 class="mt-4">Reset Password</h5>

        <p class="text-muted">
          Create a new password for your account
        </p>

        <form method="POST" action="{% url 'reset-password' %}">
          {% csrf_token %}

          {% if error %}
          <div class="alert alert-danger" role="alert">
            {{ error }}
          </div>
          {% endif %}

          <div class="mb-3 position-relative form-floating">
            <input type="password" name="new_password" id="new-password" class="form-control" placeholder="New Password" required>
            <i class="ri-eye-line toggle-eye" id="toggle-new"></i>
            <label>New Password</label>
          </div>

          <div class="mb-4 position-relative form-floating">
            <input type="password" name="confirm_password" id="confirm-password" class="form-control" placeholder="Confirm Password" required>
            <i class="ri-eye-line toggle-eye" id="toggle-confirm"></i>
            <label id="confirm-password-label">Confirm Password</label>
            <div id="password-mismatch-msg" class="text-danger mt-1 fw-medium text-start" style="display: none; font-size: 13px;">Passwords do not match</div>
          </div>
          <div class="d-flex align-items-center justify-content-center gap-2">
            <!-- BACK TO LOGIN -->
            <a href="{% url 'home' %}" class="btn btn-secondary w-100 mt-2">
              Cancel
            </a>
            
            <!-- SUBMIT -->
            <button type="submit" id="submit-btn" class="btn btn-primary w-100 mt-2" disabled>
              Reset Password
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ✅ RIGHT: IMAGE full cover -->
    <div class="d-none d-lg-block col-lg-8 col-xl-8 p-0" style="position: relative; overflow: hidden;">
      <img src="{% static 'img/auth/Login-Page-3.png' %}"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;">
    </div>

  </div>
</div>

<script>
function togglePassword(inputId, iconId) {
  const input = document.getElementById(inputId);
  const icon = document.getElementById(iconId);

  icon.addEventListener("click", function () {
    const isPassword = input.type === "password";

    input.type = isPassword ? "text" : "password";

    // switch icons correctly
    icon.classList.toggle("ri-eye-line", !isPassword);
    icon.classList.toggle("ri-eye-off-line", isPassword);
  });
}

togglePassword("new-password", "toggle-new");
togglePassword("confirm-password", "toggle-confirm");

document.addEventListener("DOMContentLoaded", function () {
  const newPassword = document.getElementById("new-password");
  const confirmPassword = document.getElementById("confirm-password");
  const confirmLabel = document.getElementById("confirm-password-label");
  const mismatchMsg = document.getElementById("password-mismatch-msg");
  const submitBtn = document.getElementById("submit-btn");

  function validatePasswords() {
    if (confirmPassword.value.length > 0) {
      if (newPassword.value === confirmPassword.value) {
        confirmLabel.style.setProperty("color", "#008A5C", "important"); // Green if match
        mismatchMsg.style.display = "none";
        submitBtn.disabled = false;
      } else {
        confirmLabel.style.setProperty("color", "#ff4d49", "important"); // Red if mismatch
        mismatchMsg.style.display = "block";
        submitBtn.disabled = true;
      }
    } else {
      confirmLabel.style.removeProperty("color");
      mismatchMsg.style.display = "none";
      submitBtn.disabled = true;
    }
  }

  newPassword.addEventListener("input", validatePasswords);
  confirmPassword.addEventListener("input", validatePasswords);
});
</script>

{% endblock %}
