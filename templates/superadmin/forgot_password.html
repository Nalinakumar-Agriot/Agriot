{% extends "superadmin/auth_base.html" %}
{% load static %}
{% block page_css %}
<style>
  .authentication-bg {
    min-height: 100vh !important;
  }

  .authentication-wrapper,
  .authentication-inner {
    max-height: 100vh !important;
    min-height: 100vh !important;
    overflow: hidden;
  }

  .row {
    margin: 0 !important; /* 🔥 fix bootstrap overflow */
  }
</style>
{% endblock %}
{% block content %}
<div class="authentication-wrapper authentication-cover">
  <div class="authentication-inner row m-0">
    <div class="d-flex col-12 col-lg-4 col-xl-4 align-items-center authentication-bg px-6">
      <div class="w-px-400 mx-auto">
        <!-- Logo -->
        <div class="text-center mb-4">
          <!-- Logo -->
          <img src="{% static 'img/auth/agri_logo_3.png' %}" width="350"
              onerror="this.src='https://via.placeholder.com/120'">
        </div>
        <p class="mb-4 text-center">Enter your mobile number and OTP will send to that Mobile Number</p>

        <form method="POST" action="{% url 'forgot-password' %}">
          {% csrf_token %}

          {% if error %}
          <div class="alert alert-danger" role="alert">
            {{ error }}
          </div>
          {% endif %}

          <!-- Mobile -->
          <div class="form-floating mb-4">
            <input type="text" class="form-control" name="mobile" placeholder="Enter Mobile Number" required>
            <label>Mobile Number</label>
          </div>
          <div class="d-flex align-items-center justify-content-center gap-2">
            <a href="{% url 'home' %}" class="btn btn-secondary w-100">Back to Login</a>
            <button type="submit" class="btn btn-primary w-100">Send OTP</button>
          </div>
        </form>

      </div>
    </div>

    <!-- ✅ RIGHT: IMAGE full cover -->
    <div class="d-none d-lg-block col-lg-8 col-xl-8 p-0" style="position: relative; overflow: hidden;">
      <img src="{% static 'img/auth/Login-Page-3.png' %}"
          style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;">
    </div>

  </div>
</div>
{% endblock %}
